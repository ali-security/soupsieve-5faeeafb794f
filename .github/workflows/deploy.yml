name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --upgrade build
          pip install 'hatchling==1.14.0'
          mkdir -p "${RUNNER_TEMP}/sitepatch"
          printf 'import importlib.util  # noqa: F401\n' > "${RUNNER_TEMP}/sitepatch/sitecustomize.py"
          PYTHONPATH="${RUNNER_TEMP}/sitepatch" python -m build -s -w --no-isolation
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
